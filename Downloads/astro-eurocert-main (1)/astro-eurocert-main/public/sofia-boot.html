<!doctype html>
<html lang="en" style="background:transparent;height:100%;margin:0">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOFIA</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: transparent !important;
        overflow: hidden;
      }
    </style>
  </head>
  <body style="background:transparent;height:100%;margin:0">
    <div id="root"></div>
    <script type="module">
      const ORIGIN = "https://eurocert-chatbot-frontend.vercel.app";

      function parentIsHome() {
        try {
          var p = window.parent && window.parent.location && window.parent.location.pathname;
          if (!p) return false;
          if (p === "/" || p === "/index.html") return true;
          if (p.length > 1 && p.endsWith("/index.html")) return true;
          if (p.endsWith("/") && p.length > 1) {
            p = p.slice(0, -1);
          }
          return p === "";
        } catch (e) {
          return false;
        }
      }

      const forceOpen = new URLSearchParams(location.search).get("open") === "1" && !parentIsHome();

      function fail(error) {
        window.parent?.postMessage({ source: "sofia-boot", type: "boot-error", message: String(error && error.message || error) }, "*");
      }

      try {
        const html = await fetch(ORIGIN + "/", { cache: "no-cache" }).then(function (r) {
          if (!r.ok) throw new Error("widget host " + r.status);
          return r.text();
        });
        const cssPath = (html.match(/href="(\/assets\/[^"]+\.css)"/) || [])[1];
        const jsPath = (html.match(/src="(\/assets\/[^"]+\.js)"/) || [])[1];
        if (!jsPath) throw new Error("widget script missing");

        if (cssPath) {
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = ORIGIN + cssPath;
          document.head.appendChild(link);
        }

        let code = await fetch(ORIGIN + jsPath, { cache: "no-cache" }).then(function (r) {
          if (!r.ok) throw new Error("widget script " + r.status);
          return r.text();
        });

        if (forceOpen) {
          // 1. Open the outer widget in DOCKED mode (open=true, fullscreen=false).
          //    The chat only moves to the centre AFTER the user clicks Maximize.
          const target1 = "function Oe(){let[e,t]=(0,_.useState)(!1),[n,r]=(0,_.useState)(!0),[i,a]=(0,_.useState)(!1)";
          const repl1 = "function Oe(){let[e,t]=(0,_.useState)(!0),[n,r]=(0,_.useState)(!0),[i,a]=(0,_.useState)(!1)";
          code = code.replace(target1, repl1);

          // 2. Keep the inner chat windowed (Ye=false) so its header shows the Maximize icon.

          // Fallback if formatting differed
          if (!code.includes("function Oe(){let[e,t]=(0,_.useState)(!0),[n,r]=(0,_.useState)(!0),[i,a]=(0,_.useState)(!1)")) {
            code = code.replace(
              "function Oe(){let[e,t]=(0,_.useState)(!1)",
              "function Oe(){let[e,t]=(0,_.useState)(!0)"
            );
          }
        }

        code = code.replaceAll("/assets/", ORIGIN + "/assets/");

        const script = document.createElement("script");
        script.type = "module";
        script.textContent = code;
        document.body.appendChild(script);
      } catch (error) {
        fail(error);
      }
    </script>
  </body>
</html>
